<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Egypt Tours</title>
    <!-- Bootstrap CSS from a CDN for simplicity -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- 1. Navigation Bar (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom border-warning border-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Discover Egypt</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Cities</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. Main Header -->
    <header class="py-5 bg-dark text-white">
        <div class="container text-center">
            <h1 class="display-4 fw-bold text-uppercase text-warning">Discover Egypt</h1>
        </div>
    </header>

    <!-- 3. Main Content Area -->
    <main class="container my-4">
        <!-- Image Slider using Bootstrap Carousel -->
        <section class="mb-5">
            <div id="mainSlider" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="images/slide-1.jpg" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Slide 1">
                    </div>
                    <div class="carousel-item">
                        <img src="images/slide-2.jpg" class="d-block w-100" style="height: 400px; object-fit: cover;" alt="Slide 2">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#mainSlider" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
                <button class="carousel-control-next" type="button" data-bs-target="#mainSlider" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
            </div>
        </section>

        <!-- City Cards Section -->
        <section>
            <h2 class="text-center mb-4">Featured Cities</h2>
            <div class="row">
                <!-- Card 1 -->
                <div class="col-md-3 col-sm-6 mb-4">
                    <div class="card h-100 text-center">
                        <img src="images/sharm.jpg" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Sharm El Sheikh">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Sharm El Sheikh</h5>
                            <a href="details.html" class="btn btn-outline-info mt-auto">Learn More</a>
                        </div>
                    </div>
                </div>
                <!-- Card 2 -->
                <div class="col-md-3 col-sm-6 mb-4">
                    <div class="card h-100 text-center">
                        <img src="images/hurghada.jpg" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Hurghada">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Hurghada</h5>
                            <a href="details.html" class="btn btn-outline-info mt-auto">Learn More</a>
                        </div>
                    </div>
                </div>  <!-- Card 3 -->
                <div class="col-md-3 col-sm-6 mb-4">
                    <div class="card h-100 text-center">
                        <img src="images/aswan.jpg" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Sharm El Sheikh">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Aswan</h5>
                            <a href="details.html" class="btn btn-outline-info mt-auto">Learn More</a>
                        </div>
                    </div>
                </div>
                <!-- Card 4 -->
                <div class="col-md-3 col-sm-6 mb-4">
                    <div class="card h-100 text-center">
                        <img src="images/portsaid.jpg" class="card-img-top" style="height: 200px; object-fit: cover;" alt="Hurghada">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Portsaid</h5>
                            <a href="details.html" class="btn btn-outline-info mt-auto">Learn More</a>
                        </div>
                    </div>
                </div>
                <!-- You can copy/paste two more cards here for a full row -->
            </div>
        </section>
    </main>

    <!-- 4. Footer -->
    <footer class="py-4 text-center text-warning bg-dark border-top border-warning border-3">
        Copyright &copy; 2025 | Egypt Tours
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
